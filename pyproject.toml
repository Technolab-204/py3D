[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mon-moteur"
version = "0.1.0"
description = "Moteur graphique 3D simple, inspiré de Pygame et Ursina"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "moderngl>=5.8",
    "glfw>=2.6",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]